name: Feature request
description: Propose an improvement or a future product capability.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: markdown
    attributes:
      value: If approved, implementation must use feature/<issue-number>-<short-kebab-name> from dev and open a pull request back to dev.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep the proposal aligned with the MVP scope, or clearly mark it for a later phase.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
