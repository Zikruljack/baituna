name: Bug report
description: Report reproducible incorrect behaviour.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Baituna. Do not include credentials or private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser or device, OS, app version, and relevant configuration.
    validations:
      required: true
